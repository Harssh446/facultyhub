{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
<div class="card" style="max-width:460px">
  <form method="post">
    {{ csrf() }}
    <div class="field"><label>Current password</label><input type="password" name="current" required></div>
    <div class="field"><label>New password <small>(min 6 characters)</small></label><input type="password" name="new" minlength="6" required></div>
    <div class="field"><label>Confirm new password</label><input type="password" name="confirm" minlength="6" required></div>
    <button class="btn btn-primary">Update password</button>
    <a class="btn btn-ghost" href="{{ url_for('dashboard') }}">Cancel</a>
  </form>
</div>
{% endblock %}
